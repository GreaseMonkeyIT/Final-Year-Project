<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MPPT for PV Arrays under Partial Shading — A Working Notebook</title>
<style>
:root{
  --bg:#fcfbf7; --surface:#ffffff; --surface2:#f5f2eb; --ink:#1a1a18; --ink2:#3a3833;
  --muted:#66625a; --rule:#e0dbd1; --rule2:#c8c2b6; --accent:#1d4ed8; --accentbg:#fcfbf7;
  --warn:#a32b2b; --warnbg:#fcfbf7; --ok:#116048; --okbg:#fcfbf7;
  --c1:#1d4ed8; --c2:#b45309; --c3:#047857; --c4:#b91c1c; --c5:#6d28d9; --c6:#0e7490;
  --grid:#eae5db; --band:#dfe6f7; --band2:#efe6d4;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SFMono-Regular","Cascadia Mono","Consolas","Liberation Mono",monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#15161a; --surface:#1a1c21; --surface2:#21242a; --ink:#e9e7e3; --ink2:#cdcac4;
    --muted:#9a978f; --rule:#2b2e35; --rule2:#3c4049; --accent:#8ab0ff; --accentbg:#15161a;
    --warn:#ef8f8f; --warnbg:#15161a; --ok:#63d3a7; --okbg:#15161a;
    --c1:#7ba6ff; --c2:#f0b357; --c3:#5ecfa4; --c4:#ff8b8b; --c5:#c4a4ff; --c6:#5fc9d8;
    --grid:#24272e; --band:#22304d; --band2:#33291a;
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth; scroll-padding-top:1.5rem}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--serif);
  font-size:17.5px;line-height:1.62;-webkit-font-smoothing:antialiased}
.wrap{display:grid;grid-template-columns:280px minmax(0,1fr);gap:0;max-width:1500px;margin:0 auto}
/* ---------------------------------------------------------------- sidebar */
nav.toc{position:sticky;top:0;align-self:start;height:100vh;overflow-y:auto;
  padding:26px 18px 60px 26px;border-right:1px solid var(--rule);font-family:var(--sans);
  font-size:13px;line-height:1.45;background:var(--surface)}
nav.toc h2{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);
  margin:0 0 12px;font-weight:600}
nav.toc a{display:block;color:var(--ink2);text-decoration:none;padding:3px 0}
nav.toc a:hover{color:var(--accent)}
nav.toc a.p{font-weight:650;margin-top:14px;color:var(--ink);font-size:13.5px}
nav.toc a.s{padding-left:13px;color:var(--muted);font-size:12.3px}
/* ------------------------------------------------------------------- main */
main{padding:44px 56px 140px;max-width:1000px;min-width:0}
h1{font-size:2.35rem;line-height:1.18;margin:0 0 .35em;letter-spacing:-.015em}
h2{font-size:1.62rem;margin:2.6em 0 .6em;line-height:1.25;letter-spacing:-.01em;
  padding-top:.5em;border-top:1px solid var(--rule)}
h3{font-size:1.18rem;margin:2em 0 .45em;line-height:1.3}
h4{font-size:1.0rem;margin:1.5em 0 .35em;font-family:var(--sans);font-weight:650;color:var(--ink2)}
p{margin:0 0 1.05em}
a{color:var(--accent)}
ul,ol{margin:0 0 1.1em;padding-left:1.35em}
li{margin:.3em 0}
strong{font-weight:650}
.lede{font-size:1.12rem;color:var(--ink2)}
.chapline{font-family:var(--sans);font-size:11.5px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--accent);font-weight:650;margin:0 0 .2em}
/* ------------------------------------------------------------------ boxes */
.note,.warnbox,.okbox{border-top:1px solid var(--rule2);border-bottom:1px solid var(--rule2);
  padding:13px 0 11px;margin:1.6em 0;font-size:16.5px}
.note p:last-child,.warnbox p:last-child,.okbox p:last-child{margin-bottom:0}
.note ul:last-child,.warnbox ul:last-child,.okbox ul:last-child{margin-bottom:0}
.boxh{font-family:var(--serif);font-variant:small-caps;font-size:15px;letter-spacing:.06em;
  font-weight:600;color:var(--ink2);margin:0 0 .35em}
/* -------------------------------------------------------------- equations */
.eq{background:var(--surface2);border:1px solid var(--rule);border-radius:6px;
  padding:14px 18px;margin:1.3em 0;font-family:var(--mono);font-size:15px;
  line-height:1.9;overflow-x:auto;color:var(--ink)}
.eq .n{float:right;color:var(--muted);font-family:var(--sans);font-size:12px}
var{font-family:var(--mono);font-style:normal;font-size:.94em}
sub,sup{font-size:.68em}
code{font-family:var(--mono);font-size:.9em;background:var(--surface2);
  padding:.1em .35em;border-radius:3px}
/* ----------------------------------------------------------------- tables */
table{border-collapse:collapse;width:100%;margin:1.3em 0;font-size:15px;
  font-family:var(--sans);display:block;overflow-x:auto;white-space:nowrap}
@media(min-width:900px){table{display:table;white-space:normal}}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-weight:650;font-size:12.5px;letter-spacing:.03em;text-transform:uppercase;
  color:var(--muted);border-bottom:1.5px solid var(--rule2)}
tbody tr:hover{background:var(--surface)}
td.num{font-family:var(--mono);white-space:nowrap}
.plus{color:var(--ok);font-weight:650}
.minus{color:var(--warn);font-weight:650}
/* --------------------------------------------------------------- figures */
figure{margin:1.8em 0;padding:0}
figure svg.fig{width:100%;height:auto;display:block;background:var(--surface);
  border:1px solid var(--rule);border-radius:7px}
figcaption{font-family:var(--sans);font-size:13.5px;color:var(--muted);
  margin-top:.6em;line-height:1.5}
.figwrap{overflow-x:auto}
/* chart element classes (shared by every generated SVG) */
svg.fig{font-family:var(--sans)}
svg .ax{stroke:var(--rule2);stroke-width:1.4;fill:none}
svg .ax2{stroke:var(--rule2);stroke-width:1;fill:none}
svg .grid{stroke:var(--grid);stroke-width:1;fill:none}
svg .tick{fill:var(--muted);font-size:12px}
svg .axlab{fill:var(--ink2);font-size:13px;font-weight:600}
svg .figtitle{fill:var(--ink2);font-size:13px;font-weight:650}
svg .leg{fill:var(--muted);font-size:12.5px}
svg .legb{fill:var(--ink);font-size:12.5px;font-weight:650}
svg .legbig{fill:var(--ink);font-size:20px;font-weight:650}
svg .lbl{fill:var(--ink2);font-size:13px}
svg .lbls{fill:var(--muted);font-size:12px}
svg .lblb{fill:var(--ink);font-size:13px;font-weight:650}
svg .lblbig{fill:var(--ink2);font-size:17px;font-weight:650;opacity:.75}
svg .lblbad{fill:var(--warn);font-size:12.5px;font-weight:650}
svg .s1{stroke:var(--c1);stroke-width:2.4;fill:none;stroke-linejoin:round}
svg .s2{stroke:var(--c2);stroke-width:2.1;fill:none;stroke-linejoin:round}
svg .s3{stroke:var(--c3);stroke-width:2.1;fill:none;stroke-linejoin:round}
svg .s4{stroke:var(--c4);stroke-width:2.1;fill:none;stroke-linejoin:round}
svg .s5{stroke:var(--c5);stroke-width:2.1;fill:none;stroke-linejoin:round}
svg .s6{stroke:var(--c6);stroke-width:2.1;fill:none;stroke-linejoin:round}
svg .dash{stroke:var(--rule2);stroke-width:1.2;stroke-dasharray:5 4;fill:none}
svg .dash2{stroke:var(--c3);stroke-width:1.5;stroke-dasharray:6 4;fill:none}
svg .dash3{stroke:var(--c4);stroke-width:1.5;stroke-dasharray:3 3;fill:none}
svg .pt{fill:var(--ink);stroke:var(--surface);stroke-width:1.5}
svg .ptsm{fill:var(--ink2);stroke:none}
svg .ptmpp{fill:var(--c3);stroke:var(--surface);stroke-width:1.8}
svg .ptbad{fill:var(--c4);stroke:var(--surface);stroke-width:1.8}
svg .band{fill:var(--band);opacity:.55;stroke:none}
svg .band2{fill:var(--band2);opacity:.65;stroke:none}
svg .arrow{stroke:var(--c3);stroke-width:1.8;fill:none}
svg .arrowb{stroke:var(--c4);stroke-width:1.8;fill:none}
svg .bar1{fill:var(--c4)}svg .bar2{fill:var(--c2)}svg .bar3{fill:var(--c2)}
svg .bar4{fill:var(--c6)}svg .bar5{fill:var(--c1)}svg .bar6{fill:var(--c3)}
/* schematic classes (hand-drawn diagrams) */
svg .wire{stroke:var(--ink2);stroke-width:2;fill:none;stroke-linecap:round}
svg .wire2{stroke:var(--muted);stroke-width:1.5;fill:none;stroke-dasharray:4 3}
svg .comp{stroke:var(--ink);stroke-width:2;fill:none;stroke-linejoin:round}
svg .fillbg{fill:var(--surface2);stroke:var(--rule2);stroke-width:1.4}
svg .fillac{fill:var(--surface2);stroke:var(--c1);stroke-width:1.5}
svg .fillwarn{fill:var(--surface2);stroke:var(--c4);stroke-width:1.5}
svg .fillok{fill:var(--surface2);stroke:var(--c3);stroke-width:1.5}
svg .node{fill:var(--ink)}
svg .stxt{fill:var(--ink);font-size:13px}
svg .stxtb{fill:var(--ink);font-size:13px;font-weight:650}
svg .stxts{fill:var(--muted);font-size:11.5px}
svg .stxtc{fill:var(--c1);font-size:12.5px;font-weight:600}
svg .flowbox{fill:var(--surface2);stroke:var(--rule2);stroke-width:1.5;rx:6}
/* ------------------------------------------------------------------- misc */
.meta{font-family:var(--sans);font-size:13px;color:var(--muted);margin:0 0 2.2em}
.rule{height:1px;background:var(--rule);margin:2.6em 0}
.kicker{font-family:var(--sans);font-size:12px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);font-weight:650}
.two{display:grid;grid-template-columns:1fr;gap:0 30px}
@media(min-width:1080px){.two{grid-template-columns:1fr 1fr}}
.deflist dt{font-family:var(--sans);font-weight:650;font-size:14.5px;margin-top:.9em}
.deflist dd{margin:.15em 0 0;padding-left:0;color:var(--ink2)}
@media(max-width:960px){
  .wrap{grid-template-columns:1fr}
  nav.toc{position:static;height:auto;border-right:none;border-bottom:1px solid var(--rule)}
  main{padding:28px 20px 90px}
}
@media print{
  nav.toc{display:none}
  body{background:#fff;color:#000;font-size:11pt}
  main{padding:0;max-width:none}
  h2{break-before:page}
  figure{break-inside:avoid}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,1 L9,5 L0,9 z" fill="var(--c3)"/></marker>
  <marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,1 L9,5 L0,9 z" fill="var(--c4)"/></marker>
  <marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,1 L9,5 L0,9 z" fill="var(--ink2)"/></marker>
  <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,1 L9,5 L0,9 z" fill="var(--c1)"/></marker>
</defs></svg>
